<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tristan Weary Photography</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
    }
    header {
      padding: 3rem 1rem;
      background-color: #000;
      color: white;
      text-align: center;
    }
    .gallery {
      column-count: 4;
      column-gap: 1rem;
      padding: 1rem;
    }
    .gallery img {
      width: 100%;
      margin-bottom: 1rem;
      border-radius: 0.5rem;
      transition: opacity 0.3s;
      cursor: pointer;
    }
    .gallery img:hover {
      opacity: 0.7;
    }
    @media (max-width: 992px) {
      .gallery {
        column-count: 3;
      }
    }
    @media (max-width: 768px) {
      .gallery {
        column-count: 2;
      }
    }
    @media (max-width: 576px) {
      .gallery {
        column-count: 1;
      }
    }
    footer {
      background: #000;
      color: white;
      padding: 2rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>Tristan Weary Photography</h1>
    <p>Editorial / Portraiture / Music / Branding</p>
  </header>

  <div class="gallery">
    <img src="img/jamie_8688.jpg" alt="">
    <img src="img/_DSC4982_COLLAGE2.jpg" alt="">
    <img src="img/lisa_highkey.jpg" alt="">
    <img src="img/crimelight.jpg" alt="">
    <img src="img/pistil_0802.jpg" alt="">
    <img src="img/chadd_1534.jpg" alt="">
    <img src="img/LLB_4164dess.jpg" alt="">
    <img src="img/DSC_9359.jpg" alt="">
    <img src="img/_LLB4958.jpg" alt="">
    <img src="img/auxum.png" alt="">
    <img src="img/DSC_0604.jpg" alt="">
    <img src="img/DSC_0744.jpg" alt="">
    <img src="img/_DSC5210.jpg" alt="">
  </div>

  <footer>
    &copy; 2025 Tristan Weary Photography
  </footer>

</body>
</html>
